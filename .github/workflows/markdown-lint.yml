name: Markdown Lint

on:
  push:
    branches: [ master ]
    paths:
      - '**.md'
  pull_request:
    branches: [ master ]
    paths:
      - '**.md'

jobs:
  markdownlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run markdownlint
        uses: DavidAnson/markdownlint-cli2-action@v18
        with:
          globs: |
            **/*.md
            !.git/**
            !.obsidian/**
            !.trash/**
            !node_modules/**
